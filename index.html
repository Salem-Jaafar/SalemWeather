<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Conditions</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(to bottom right, #134e4a, #0f766e);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }

    .weather-container {
      width: 90%;
      max-width: 400px;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
    }

    input,
    button {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 8px;
      font: inherit;
    }

    input {
      width: 100%;
    }

    button {
      margin-top: 1rem;
      background: #0984e3;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #076bb8;
    }

    #result {
      margin-top: 1.5rem;
    }

    .temperature {
      margin: 0;
      font-size: 2.5rem;
      font-weight: bold;
    }

    .error {
      color: #ffeaa7;
      font-weight: bold;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
    }
  </style>
</head>

<body>
  <main class="weather-container">
    <h1>🌦️ Weather Conditions</h1>

    <form id="weatherForm">
      <label for="cityInput">Enter a city to see its current weather.</label>
      <input type="text" id="cityInput" value="Ajman, AE" required />
      <button type="submit">Get Weather</button>
    </form>

    <section id="result" aria-live="polite"></section>
  </main>

  <footer>Created by <bdi lang="ar">سالم</bdi> · Powered by OpenWeatherMap</footer>

  <script>
    const apiKey = "YOUR_API_KEY";
    const form = document.getElementById("weatherForm");
    const cityInput = document.getElementById("cityInput");
    const result = document.getElementById("result");
    let latestRequest = 0;

    async function getWeather() {
      const requestId = ++latestRequest;
      const city = cityInput.value.trim().replace(/\s*,\s*/g, ",");
      result.className = "";

      if (!city) {
        result.textContent = "Please enter a city name.";
        return;
      }

      if (apiKey === "YOUR_API_KEY") {
        result.textContent = "Add your OpenWeatherMap API key to load the weather.";
        return;
      }

      result.textContent = "Loading weather...";

      const url = new URL("https://api.openweathermap.org/data/2.5/weather");
      url.search = new URLSearchParams({
        q: city,
        appid: apiKey,
        units: "metric",
        lang: "en"
      }).toString();

      try {
        const response = await fetch(url);

        if (response.status === 404) {
          throw new Error("City not found. Please check the spelling.");
        }

        if (response.status === 401) {
          throw new Error("Please check your OpenWeatherMap API key.");
        }

        if (!response.ok) {
          throw new Error("Weather is unavailable. Please try again later.");
        }

        const data = await response.json();
        if (requestId !== latestRequest) return;

        const weather = data.weather[0];

        const location = document.createElement("h2");
        location.textContent = `${data.name}, ${data.sys.country}`;

        const icon = document.createElement("img");
        icon.src = `https://openweathermap.org/img/wn/${weather.icon}@2x.png`;
        icon.alt = "";

        const temperature = document.createElement("p");
        temperature.className = "temperature";
        temperature.textContent = `${Math.round(data.main.temp)}°C`;

        const description = document.createElement("p");
        description.textContent =
          weather.description.charAt(0).toUpperCase() +
          weather.description.slice(1);

        result.replaceChildren(location, icon, temperature, description);
      } catch (error) {
        if (requestId !== latestRequest) return;

        result.className = "error";
        result.textContent = error instanceof TypeError
          ? "Could not load the weather. Please check your internet connection."
          : error.message;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      getWeather();
    });

    getWeather();
  </script>
</body>
</html>
